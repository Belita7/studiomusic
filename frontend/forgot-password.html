
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b12">

    <title>Recuperar palavra-passe | StudioMusic.AI</title>

    <meta
        name="description"
        content="Recupera o acesso à tua conta StudioMusic.AI."
    >

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
    >

    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="theme.css">
</head>

<body>

    <main class="auth-container">

        <a href="index.html" class="brand-logo">
            <span class="material-icons logo-icon">graphic_eq</span>
            <span>StudioMusic<span class="brand-ai">.AI</span></span>
        </a>

        <section class="auth-card">

            <div class="icon-container">
                <span class="material-icons">lock_reset</span>
            </div>

            <div class="auth-header">
                <h1>Recuperar palavra-passe</h1>

                <p>
                    Esqueceste-te da tua palavra-passe?
                    Introduz o e-mail associado à tua conta
                    e enviaremos instruções para recuperares o acesso.
                </p>
            </div>

            <div
                id="message"
                class="message"
                role="status"
                aria-live="polite"
                hidden
            ></div>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">Endereço de e-mail</label>

                    <div class="input-wrapper">
                        <span class="material-icons input-icon">mail</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="exemplo@email.com"
                            autocomplete="email"
                            maxlength="255"
                            required
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    id="submitButton"
                    class="primary-button"
                >
                    <span id="buttonText">Enviar instruções</span>
                    <span class="material-icons">arrow_forward</span>
                </button>

            </form>

            <div class="back-link">
                <a href="login.html">
                    <span class="material-icons">arrow_back</span>
                    Voltar ao início de sessão
                </a>
            </div>

        </section>

        <footer>
            <p>StudioMusic.AI — A tua música, a tua criatividade.</p>
        </footer>

    </main>

    <script src="forgot-password.js"></script>

</body>
</html>
