
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova palavra-passe | StudioMusic</title>

    <link rel="stylesheet" href="reset-password.css">
</head>
<body>

    <main class="auth-container">
        <a href="index.html" class="brand">
            <span class="brand-icon">♫</span>
            <span>StudioMusic</span>
        </a>

        <section class="auth-card">
            <div class="card-icon">🔐</div>

            <h1>Nova palavra-passe</h1>

            <p class="description">
                Cria uma nova palavra-passe para a tua conta StudioMusic.
            </p>

            <form id="resetPasswordForm">

                <div class="form-group">
                    <label for="password">Nova palavra-passe</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Introduz a nova palavra-passe"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirmar palavra-passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repete a nova palavra-passe"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="password-hint">
                    A palavra-passe deve ter pelo menos 8 caracteres.
                </div>

                <div id="message" class="message" role="status"></div>

                <button type="submit" id="submitButton">
                    <span id="buttonText">Guardar nova palavra-passe</span>
                </button>

            </form>

            <div class="back-link">
                <a href="login.html">Voltar ao início de sessão</a>
            </div>
        </section>

        <footer>
            © 2026 StudioMusic. Todos os direitos reservados.
        </footer>
    </main>

    <script src="reset-password.js"></script>
</body>
</html>
